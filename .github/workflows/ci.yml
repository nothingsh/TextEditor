name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package tests and docs
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick a simulator
        run: echo "SIMULATOR=$(.github/scripts/simulator.sh)" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme TextEditor \
            -destination "id=$SIMULATOR" \
            -resultBundlePath TestResults/Package.xcresult \
            2>&1 | tee xcodebuild.log | grep -E ": (error|warning): |Test Case .* failed|Executed [0-9]+ tests?,|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log

      - name: Build documentation without warnings
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme TextEditor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DocsBuild \
            2>&1 | tee docbuild.log | grep -E ": (error|warning): |\*\* BUILD" || true
          grep -q "BUILD DOCUMENTATION SUCCEEDED" docbuild.log
          if grep -E "^/.*warning:" docbuild.log; then
            echo "::error::DocC reported warnings"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-test-results
          path: TestResults
          if-no-files-found: ignore

  example:
    name: Example app and UI tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The UI tests tap where the sample document draws its checkboxes on a 402-point-wide iPhone.
      - name: Pick a simulator
        run: echo "SIMULATOR=$(.github/scripts/simulator.sh 'iPhone 17 Pro' 'iPhone 16 Pro')" >> "$GITHUB_ENV"

      - name: Boot the simulator
        run: xcrun simctl bootstatus "$SIMULATOR" -b

      - name: Build and run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Example/TextEditorExample.xcodeproj \
            -scheme TextEditorExample \
            -destination "id=$SIMULATOR" \
            -resultBundlePath TestResults/Example.xcresult \
            2>&1 | tee xcodebuild.log | grep -E ": (error|warning): |Test Case .* failed|Executed [0-9]+ tests?,|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-test-results
          path: TestResults
          if-no-files-found: ignore
